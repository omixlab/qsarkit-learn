[build-system]
# setuptools>=77 understands the PEP 639 `license`/`license-files` fields.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `qsarkit-learn`; the package you import is `qsarkit`.
# The two differ for the same reason scikit-learn installs as `scikit-learn`
# and imports as `sklearn`: the bare name `qsarkit` on PyPI was taken in May
# 2024 by an unrelated project (qsarKit, Tahiri Lab), and PyPI names are
# case-insensitive, so it is not available to us.
name = "qsarkit-learn"
# Single-sourced from qsarkit/__init__.py, so the git tag, the wheel metadata
# and the version the documentation displays cannot drift apart. setuptools
# reads it by parsing the AST, so building does not import qsarkit (and so
# does not need RDKit present at build time). Bump it with `make bump-patch`.
dynamic = ["version"]
description = "A focused Python library for QSAR modeling: structure curation, molecular representation, model building and selection, OECD-aligned validation, applicability domain, uncertainty and SAR interpretation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frederico Schmitt Kremer" }]
keywords = [
    "qsar", "cheminformatics", "rdkit", "molecular-descriptors",
    "machine-learning", "drug-discovery", "applicability-domain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "rdkit>=2022.9.1",
    "networkx>=3.0",
    "plotly>=5.15",
]

# Shown in the sidebar on PyPI. Without these the project page carries no
# links at all.
[project.urls]
Homepage = "https://github.com/omixlab/qsarkit-learn"
Documentation = "https://omixlab.github.io/qsarkit-learn/"
Repository = "https://github.com/omixlab/qsarkit-learn"
Issues = "https://github.com/omixlab/qsarkit-learn/issues"
Changelog = "https://omixlab.github.io/qsarkit-learn/changelog.html"

[project.optional-dependencies]
embeddings = ["gensim>=4.3"]
nlp = ["transformers>=4.30", "torch>=2.0"]
explainability = ["shap>=0.42", "lime>=0.2"]
boosting = ["xgboost>=1.7", "lightgbm>=3.3"]
reporting = ["kaleido>=0.2.1", "reportlab>=4.0"]
# Pickle-free model persistence. Without it, qsarkit.persistence still
# imports but save/load raise, naming this extra.
persistence = ["skops>=0.9"]
balancing = ["imbalanced-learn>=0.11"]
embedding_viz = ["umap-learn>=0.5"]
dev = [
    "pytest>=7.3",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "pandas-stubs",
    "ruff>=0.1",
    # the example notebooks are executed as part of the test suite
    "nbformat>=5.9",
    "nbclient>=0.8",
    "ipykernel>=6.25",
]
docs = [
    "sphinx>=7.0",
    "furo>=2023.9.10",
    "sphinx-autodoc-typehints>=1.24",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "sphinx-design>=0.5",
]
all = [
    "gensim>=4.3", "transformers>=4.30", "torch>=2.0",
    "shap>=0.42", "lime>=0.2", "xgboost>=1.7", "lightgbm>=3.3",
    "kaleido>=0.2.1", "reportlab>=4.0", "umap-learn>=0.5",
    "skops>=0.9", "imbalanced-learn>=0.11",
]

[tool.setuptools.packages.find]
include = ["qsarkit*"]

[tool.setuptools.package-data]
qsarkit = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "qsarkit.__version__" }

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` covers the notebook executions, which spin up a Jupyter kernel each.
# Run them with `pytest -m slow` (or `pytest -m ""` for everything).
addopts = "-m 'not slow'"
markers = [
    "slow: long-running test (deselected by default; run with -m slow)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["qsarkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Lines that cannot be exercised without the corresponding optional
# dependency installed, or that exist only for static type checkers.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
]

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
# mypy 2.x no longer supports targeting 3.9; 3.10 is its floor. The
# package itself still supports 3.9 (see requires-python) - we rely on
# `from __future__ import annotations` plus Optional[X] over X | None
# in runtime-evaluated positions to stay 3.9-compatible.
python_version = "3.10"
explicit_package_bases = true
mypy_path = "typings"
files = ["qsarkit"]
strict = true
# RDKit ships no stubs; several optional deps are untyped. Silence only the
# missing-import noise, never the real type errors in our own code.
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
warn_unused_configs = true
show_error_codes = true
pretty = true
# mypyc-friendliness: keep the annotations importable at runtime.
disallow_any_generics = false
# RDKit and scikit-learn are effectively untyped from mypy's point of view
# (see the typings/ shadow and the overrides below), so their classes and
# functions arrive as Any. Subclassing sklearn's BaseEstimator/ClusterMixin
# and calling RDKit functions must therefore stay legal. These two flags
# only ever fire on third-party Any - every requirement that matters for
# our own code (full annotations, no untyped defs, no implicit Optional)
# is still enforced.
disallow_subclassing_any = false
disallow_untyped_calls = false

# RDKit is handled by the local stub shadow in typings/ (see the README);
# these are the remaining optional dependencies that ship no type stubs.
# `ignore_missing_imports = true` is already set globally above, so these
# per-module overrides only mattered when it was not. mypy reports them as
# unused sections; the list is kept as documentation of which third-party
# packages ship no type information, with the redundant flag removed.
#
# Untyped: rdkit (see the typings/ shadow), sklearn, scipy, plotly,
# networkx, transformers, torch, gensim, shap, lime, umap, xgboost,
# lightgbm, joblib, nbformat, nbclient, reportlab, skops, imblearn.

# Note: `files = ["qsarkit"]` above means the test suite is not type-checked,
# so no `tests.*` override is needed. Run `mypy tests` explicitly to check it.

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401", "E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"__init__.py" = ["F401"]
