# Publish qsarkit-learn to PyPI.
#
# Triggered by pushing a version tag, which is what `make release` does:
#
#   make bump-patch          bump the version, rebuild docs/
#   git commit -am "…"       commit the bump
#   make release             tag v<version> and push -> this workflow runs
#
# Creating a GitHub Release afterwards is optional and does not publish again;
# the tag push is the only trigger, so a tag can never be published twice by
# two events racing each other.
#
# Use `workflow_dispatch` to rehearse against TestPyPI before a real release.
#
# ---------------------------------------------------------------------------
# One-time setup, on PyPI (and separately on TestPyPI):
#
# Publishing uses trusted publishing (OIDC), so there is no API token to store.
# It has to be authorised once, and because the project does not exist on PyPI
# yet, that means creating a *pending* publisher at
# https://pypi.org/manage/account/publishing/ with:
#
#     PyPI project name:  qsarkit-learn
#     Owner:              omixlab
#     Repository:         qsarkit-learn
#     Workflow name:      python-publish.yml
#     Environment:        pypi          (testpypi for TestPyPI)
#
# The workflow filename and environment name above must match exactly, so
# renaming this file means updating the publisher.
#
# Adding a required reviewer to the `pypi` environment in the repository
# settings is worth doing: a PyPI upload cannot be replaced or undone, so an
# accidental tag push is otherwise unrecoverable except by burning a version.
# ---------------------------------------------------------------------------

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

# Never let two runs publish the same ref concurrently, and never cancel a run
# that may already be mid-upload.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned rather than "3.x": the wheel is py3-none-any either way, but
          # a floating interpreter means the build environment drifts between
          # releases for no benefit.
          python-version: "3.12"

      - name: Read the package version
        id: version
        run: echo "version=$(python tools/bump_version.py show)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match the package version $pkg."
            echo "The version lives in qsarkit/__init__.py; bump it with"
            echo "\`make bump-patch\`, which also tags consistently via"
            echo "\`make release\`. Delete the bad tag and try again:"
            echo "  git tag -d v$tag && git push --delete origin v$tag"
            exit 1
          fi
          echo "Tag and package version agree: $pkg"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check the metadata PyPI will render
        run: python -m twine check --strict dist/*

      - name: List what was built
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Named explicitly: with no requirements.txt in the repo, leaving the
          # default glob to find a dependency file is a setup step that can
          # start failing on an action upgrade.
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,persistence,balancing]"

      - name: Run the tests
        # The notebook executions are marked slow and excluded by the default
        # addopts; everything else runs.
        run: python -m pytest -q

  smoke-test:
    name: Installed wheel (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # The lowest and highest interpreters the package claims to support.
        # A PyPI upload cannot be replaced, so a wheel that does not import is
        # a permanent mistake; this is the last chance to catch one.
        python-version: ["3.9", "3.13"]
    steps:
      # Deliberately no checkout: with no source tree present, `import qsarkit`
      # can only resolve to the installed wheel, so this cannot pass by
      # accidentally importing the repository.
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Import it and fit a model
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os

          import qsarkit

          expected = os.environ["EXPECTED_VERSION"]
          if qsarkit.__version__ != expected:
              raise SystemExit(
                  f"installed {qsarkit.__version__}, expected {expected}"
              )

          from rdkit import Chem

          from qsarkit.models import QSARRegressor
          from qsarkit.representation import MorganFingerprint

          smiles = ["CCO", "c1ccccc1O", "CC(=O)O", "CCN", "c1ccccc1", "CCCCO"]
          y = [0.5, 1.8, 1.1, 0.4, 1.5, 0.9]
          mols = [Chem.MolFromSmiles(s) for s in smiles]

          X = MorganFingerprint(radius=2, n_bits=256).transform(mols)
          assert X.shape == (6, 256), X.shape

          preds = QSARRegressor("rf", random_state=0).fit(X, y).predict(X)
          assert preds.shape == (6,), preds.shape

          print(f"qsarkit {qsarkit.__version__} imports and fits on this interpreter")
          PY

      - name: Check the type marker survived packaging
        run: |
          python - <<'PY'
          from importlib.resources import files

          marker = files("qsarkit") / "py.typed"
          if not marker.is_file():
              raise SystemExit("py.typed is missing from the wheel")
          print("py.typed present")
          PY

  publish:
    name: Publish to PyPI
    needs: [build, test, smoke-test]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qsarkit-learn
    permissions:
      # Mandatory for trusted publishing: the job exchanges this token for a
      # short-lived PyPI credential. Scoped to this job alone.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      # Pinned to a commit rather than a moving branch, because this is the one
      # step that holds publishing credentials. dc37677 is v1.14.2.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          # Left false on purpose: a version PyPI already has means the bump
          # was forgotten, and failing loudly is the right outcome.
          skip-existing: false

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test, smoke-test]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qsarkit-learn
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          # Rehearsals are re-run against the same version routinely, so a
          # duplicate here is expected rather than a mistake.
          skip-existing: true
