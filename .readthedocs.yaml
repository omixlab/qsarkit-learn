# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - pdf
  - epub

python:
  install:
    # The `docs` extra pulls Sphinx + theme; installing the package itself
    # (without the heavy extras) lets autodoc import it. Optional deps are
    # mocked in conf.py, so torch/transformers are never downloaded here.
    - method: pip
      path: .
      extra_requirements:
        - docs
